apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: orderflow
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
