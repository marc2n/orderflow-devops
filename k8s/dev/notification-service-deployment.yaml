apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: orderflow
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: notification-service
          image: acrorderflowmarc2ndev1.azurecr.io/notification-service@sha256:7d8341ffc2c7d9fa1fe8aef45497757fc3b289d8a34903900227a08492ae1bf4
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082

          envFrom:
            - configMapRef:
                name: notification-service-config

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: temporary
              mountPath: /tmp

      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi