apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: orderflow-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8082
      targetPort: http