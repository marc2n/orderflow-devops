apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: kafka-topic-init
    app.kubernetes.io/part-of: orderflow
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topic-init
        app.kubernetes.io/part-of: orderflow
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: init
          image: acrorderflowmarc2ndev1.azurecr.io/third-party/kafka@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ec
          args:
            - |
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create \
                --if-not-exists \
                --topic order-events-v1 \
                --partitions 3 \
                --replication-factor 1

              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --describe \
                --topic order-events-v1

          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx256m
            - name: LOG_DIR
              value: /tmp/kafka-logs

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          volumeMounts:
            - name: temporary
              mountPath: /tmp

      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi