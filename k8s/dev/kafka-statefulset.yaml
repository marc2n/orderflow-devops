apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  serviceName: kafka-headless
  replicas: 1
  revisionHistoryLimit: 3

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app.kubernetes.io/name: kafka

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: orderflow
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kafka
          image: acrorderflowmarc2ndev1.azurecr.io/third-party/kafka@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093

          env:
            - name: CLUSTER_ID
              value: qPuOwC5FQpmZHtoeZ4V5FQ
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller

            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka-headless.orderflow-dev.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka-headless.orderflow-dev.svc.cluster.local:9093

            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
            - name: LOG_DIR
              value: /tmp/kafka-logs

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi

          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  KAFKA_HEAP_OPTS="-Xms32m -Xmx128m" \
                    /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server localhost:9092 \
                    --list >/dev/null 2>&1
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: generated-config
              mountPath: /opt/kafka/config
            - name: temporary
              mountPath: /tmp

      volumes:
        - name: generated-config
          emptyDir:
            sizeLimit: 32Mi
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: orderflow-dev-standard-ssd
        resources:
          requests:
            storage: 32Gi