apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orderflow-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker