apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: orderflow-dev
data:
  SPRING_DOCKER_COMPOSE_ENABLED: "false"

  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/orderflow"
  SPRING_DATASOURCE_USERNAME: "orderflow"

  # Temporary development schema management.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

  # Required CSI-mounted configuration tree.
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets/"

  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: "never"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"

  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: "20s"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: orderflow-dev
data:
  SPRING_DOCKER_COMPOSE_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: "never"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"

  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: "20s"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError"