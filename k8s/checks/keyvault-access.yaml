apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-keyvault-check
  namespace: orderflow-dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-keyvault-check
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mysql
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: acrorderflowmarc2ndev1.azurecr.io/order-service@sha256:3e454048cb39b33f6b062c40d95f6e2cfee7491c8bb3716aabafd4860df03de2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -r /mnt/secrets/mysql-root-password
              test -s /mnt/secrets/mysql-root-password
              test -r /mnt/secrets/mysql-password
              test -s /mnt/secrets/mysql-password
              echo "PASS: MySQL password files are readable and nonempty."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mysql-keyvault
---
apiVersion: batch/v1
