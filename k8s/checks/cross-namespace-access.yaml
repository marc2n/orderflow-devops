apiVersion: v1
kind: Namespace
metadata:
  name: orderflow-network-check
---
apiVersion: v1
kind: Pod
metadata:
  name: cross-namespace-check
  namespace: orderflow-network-check
  labels:
    app.kubernetes.io/name: order-service
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 600
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: acrorderflowmarc2ndev1.azurecr.io/third-party/kafka@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
      command: ["/bin/sh", "-ec", "sleep 600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi