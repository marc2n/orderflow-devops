name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  java-build:
    runs-on: ubuntu-latest
    env:
      SHORT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven test
        run: ./mvnw -B test

      - name: Maven package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
        run: ./mvnw -B package -DskipTests

      - name: Sonar analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.organization="$SONAR_ORGANIZATION" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.host.url=https://sonarcloud.io
          else
            echo "SonarCloud configuration not provided; skipping Sonar analysis."
          fi

  docker-build-scan-push:
    needs: java-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: notification-service
            image: ${{ secrets.DOCKERHUB_USERNAME }}/notification-service
            dockerfile: notification-service/Dockerfile
          - service: order-service
            image: ${{ secrets.DOCKERHUB_USERNAME }}/order-service
            dockerfile: order-service/Dockerfile
    env:
      SHORT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for ${{ matrix.service }}
        run: docker build -t ${{ matrix.image }}:${SHORT_SHA:0:4} -f ${{ matrix.dockerfile }} .

      - name: Scan Docker image for ${{ matrix.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ matrix.image }}:${SHORT_SHA:0:4}

      - name: Tag image as latest for ${{ matrix.service }}
        run: docker tag ${{ matrix.image }}:${SHORT_SHA:0:4} ${{ matrix.image }}:latest

      - name: Push image to Docker Hub for ${{ matrix.service }}
        run: |
          docker push ${{ matrix.image }}:${SHORT_SHA:0:4}
          docker push ${{ matrix.image }}:latest