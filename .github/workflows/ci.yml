name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  java-build:
    runs-on: ubuntu-latest
    env:
      SHORT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven test
        run: mvn -B test

      - name: Maven package
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
        run: mvn -B package -DskipTests

      - name: Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.organization="$SONAR_ORGANIZATION" \
              -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
              -Dsonar.host.url=https://sonarcloud.io
          else
            echo "SonarCloud configuration not provided; skipping Sonar analysis."
          fi

  docker-build-scan-push:
    needs: java-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: notification-service
            dockerfile: notification-service/Dockerfile
          - service: order-service
            dockerfile: order-service/Dockerfile
    env:
      SHORT_SHA: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for ${{ matrix.service }}
        run: |
          IMAGE=${DOCKERHUB_USERNAME}/${{ matrix.service }}
          docker build -t ${IMAGE}:${SHORT_SHA} -f ${{ matrix.dockerfile }} .
          # create short tag (first 4 chars) and latest tag
          docker tag ${IMAGE}:${SHORT_SHA} ${IMAGE}:${SHORT_SHA:0:4}
          docker tag ${IMAGE}:${SHORT_SHA} ${IMAGE}:latest

      - name: Scan Docker image for ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to Docker Hub for ${{ matrix.service }}
        run: |
          IMAGE=${DOCKERHUB_USERNAME}/${{ matrix.service }}
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:${SHORT_SHA:0:4}
          docker push ${IMAGE}:latest